<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mimada - Contraseña Actualizada</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #fdf0f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        .card {
            background: white;
            border-radius: 16px;
            border: 0.5px solid #f0c0d4;
            padding: 2rem;
            width: 100%;
            max-width: 340px;
            text-align: center;
        }
        .success-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #fce4ec;
            border: 1.5px solid #e91e8c;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 28px;
        }
        .title {
            font-size: 20px;
            font-weight: 600;
            color: #c2185b;
            margin-bottom: 0.8rem;
        }
        .info-text {
            font-size: 13px;
            color: #888;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .btn-primary {
            width: 100%;
            background: #e91e8c;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: block;
        }
        .btn-primary:hover { background: #c2185b; }
        .footer {
            font-size: 11px;
            color: #ccc;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <div class="success-icon">✅</div>
        <p class="title">¡Contraseña actualizada!</p>
        <p class="info-text">
            Tu contraseña ha sido restablecida exitosamente.
            Ya puedes iniciar sesión con tu nueva contraseña.
        </p>
        <a href="{% url 'usuarios:login' %}" class="btn-primary">
            INICIAR SESIÓN →
        </a>
    </div>
    <div class="footer">
        © 2026 Mimada. Artesanía Colombiana.<br>
        📱 Contacto: 323 888 3587<br>
        📷 Instagram: @mimada.detalles
    </div>
</div>
</body>
</html>
