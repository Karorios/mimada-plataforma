<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimada - Administrador</title>
    {% load static %}
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #fdf0f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        .card {
            background: white;
            border-radius: 16px;
            border: 0.5px solid #f0c0d4;
            padding: 2rem;
            width: 100%;
            max-width: 340px;
        }
        .brand {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .brand-name {
            font-size: 22px;
            font-weight: 600;
            color: #c2185b;
        }
        .brand-sub {
            font-size: 12px;
            color: #e91e8c;
            margin-top: 2px;
        }
        .field-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }
        .field-wrap {
            position: relative;
            margin-bottom: 1rem;
        }
        .field-wrap input {
            width: 100%;
            border: 0.5px solid #f0c0d4;
            border-radius: 8px;
            padding: 10px 36px 10px 12px;
            font-size: 14px;
            background: #fff9fb;
            outline: none;
            color: #333;
        }
        .field-wrap input:focus {
            border-color: #e91e8c;
            background: white;
        }
        .field-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #e91e8c;
            cursor: pointer;
        }
        .error-msg {
            background: #fce4ec;
            border: 1px solid #f48fb1;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: #c2185b;
            margin-bottom: 1rem;
        }
        .btn-login {
            width: 100%;
            background: #c2185b;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-login:hover { background: #880e4f; }
        .back-link {
            text-align: center;
            margin-top: 1.2rem;
            font-size: 13px;
        }
        .back-link a {
            color: #e91e8c;
            text-decoration: none;
            font-weight: 600;
        }
        .footer {
            font-size: 11px;
            color: #ccc;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <div class="brand">
            <img src="{% static 'img/logo.png' %}"
                 alt="Mimada"
                 style="width: 80px; margin: 0 auto 0.5rem; display: block;" />
            <p class="brand-name">Mimada</p>
            <p class="brand-sub">Acceso Administrador</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="error-msg">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label class="field-label">Usuario</label>
            <div class="field-wrap">
                <input type="text" name="username"
                       placeholder="Usuario administrador" required />
                <span class="field-icon">👤</span>
            </div>

            <label class="field-label">Contraseña</label>
            <div class="field-wrap">
                <input type="password" name="password"
                       id="password" placeholder="••••••••" required />
                <span class="field-icon" onclick="togglePassword()"
                      id="eye-icon">👁</span>
            </div>

            <button type="submit" class="btn-login">
                INGRESAR COMO ADMINISTRADOR →
            </button>
        </form>

        <div class="back-link">
            <a href="{% url 'usuarios:login' %}">← Volver al inicio</a>
        </div>
    </div>

    <div class="footer">
        © 2026 Mimada. Artesanía Colombiana. <br>
        📞 323 888 3587 &nbsp;|&nbsp;
        📸 <a href="https://www.instagram.com/mimada.detalles"
               target="_blank"
               style="color: #e91e8c; text-decoration: none;">
            @mimada.detalles
        </a>
    </div>
</div>
<script>
    function togglePassword() {
        const input = document.getElementById('password');
        const icon = document.getElementById('eye-icon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = '🙈';
        } else {
            input.type = 'password';
            icon.textContent = '👁';
        }
    }
</script>
</body>
</html>
