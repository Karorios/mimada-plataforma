<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mimada - Nueva Contraseña</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #fdf0f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        .card {
            background: white;
            border-radius: 16px;
            border: 0.5px solid #f0c0d4;
            padding: 2rem;
            width: 100%;
            max-width: 340px;
        }
        .brand {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        {% load static %}
        .brand-name {
            font-size: 22px;
            font-weight: 600;
            color: #c2185b;
        }
        .brand-sub {
            font-size: 12px;
            color: #e91e8c;
            margin-top: 2px;
        }
        .field-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }
        .field-wrap {
            position: relative;
            margin-bottom: 1rem;
        }
        .field-wrap input {
            width: 100%;
            border: 0.5px solid #f0c0d4;
            border-radius: 8px;
            padding: 10px 36px 10px 12px;
            font-size: 14px;
            background: #fff9fb;
            outline: none;
            color: #333;
        }
        .field-wrap input:focus {
            border-color: #e91e8c;
            background: white;
        }
        .field-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #e91e8c;
            cursor: pointer;
        }
        .btn-primary {
            width: 100%;
            background: #e91e8c;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-primary:hover { background: #c2185b; }
        .footer {
            font-size: 11px;
            color: #ccc;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <div class="brand">
            <div class="brand-icon">🔒</div>
            <p class="brand-name">Mimada</p>
            <p class="brand-sub">Crear nueva contraseña</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <label class="field-label">Nueva contraseña</label>
            <div class="field-wrap">
                <input type="password" name="new_password1"
                       id="pass1" placeholder="••••••••" required />
                <span class="field-icon" onclick="toggle('pass1', 'eye1')"
                      id="eye1">👁</span>
            </div>

            <label class="field-label">Confirmar contraseña</label>
            <div class="field-wrap">
                <input type="password" name="new_password2"
                       id="pass2" placeholder="••••••••" required />
                <span class="field-icon" onclick="toggle('pass2', 'eye2')"
                      id="eye2">👁</span>
            </div>

            <button type="submit" class="btn-primary">
                GUARDAR CONTRASEÑA →
            </button>
        </form>
    </div>
    <<div class="footer">
    © 2026 Mimada. Artesanía Colombiana.<br>
    📱 Contacto: 323 888 3587<br>
    📷 Instagram: @mimada.detalles
    </div>
</div>
<script>
    function toggle(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = '🙈';
        } else {
            input.type = 'password';
            icon.textContent = '👁';
        }
    }
</script>
</body>
</html>
