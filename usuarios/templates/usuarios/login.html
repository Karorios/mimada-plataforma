<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimada - Iniciar Sesión</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #fdf0f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }
        .card {
            background: white;
            border-radius: 16px;
            border: 0.5px solid #f0c0d4;
            padding: 2rem;
            width: 100%;
            max-width: 340px;
        }
        .brand {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        {% load static %}

        .brand-name {
            font-size: 22px;
            font-weight: 600;
            color: #c2185b;
        }
        .brand-sub {
            font-size: 12px;
            color: #e91e8c;
            margin-top: 2px;
        }
        .field-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: #888;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: block;
        }
        .field-wrap {
            position: relative;
            margin-bottom: 1rem;
        }
        .field-wrap input {
            width: 100%;
            border: 0.5px solid #f0c0d4;
            border-radius: 8px;
            padding: 10px 36px 10px 12px;
            font-size: 14px;
            background: #fff9fb;
            outline: none;
            color: #333;
        }
        .field-wrap input:focus {
            border-color: #e91e8c;
            background: white;
        }
        .field-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #e91e8c;
            font-size: 16px;
        }
        .forgot {
            text-align: right;
            margin-top: -6px;
            margin-bottom: 1.2rem;
        }
        .forgot a {
            font-size: 12px;
            color: #e91e8c;
            text-decoration: none;
        }
        .btn-login {
            width: 100%;
            background: #e91e8c;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.05em;
            cursor: pointer;
        }
        .btn-login:hover { background: #c2185b; }
        .divider {
            text-align: center;
            font-size: 12px;
            color: #bbb;
            margin: 1.2rem 0;
        }
        .register-link {
            text-align: center;
            font-size: 13px;
            color: #888;
        }
        .register-link a {
            color: #e91e8c;
            text-decoration: none;
            font-weight: 600;
        }
        .messages {
            background: #fce4ec;
            border: 1px solid #f48fb1;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: #c2185b;
            margin-bottom: 1rem;
        }
        .footer {
            font-size: 11px;
            color: #ccc;
            text-align: center;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="card">
        <div class="brand">
            <img src="{% static 'img/logo.png' %}"
            alt="Mimada"
            style="width: 120px; margin: 0 auto 0.5rem; display: block;" />
            <p class="brand-sub">Detalles, accesorios y más</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="messages">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label class="field-label">Correo electrónico</label>
            <div class="field-wrap">
                <input type="email" name="username"
                       placeholder="nombre@ejemplo.com" required />
                <span class="field-icon">✉</span>
            </div>

            <label class="field-label">Contraseña</label>
            <div class="field-wrap">
                <input type="password" name="password" id="password"
                       placeholder="••••••••" required />
                <span class="field-icon" onclick="togglePassword()"
                      style="cursor:pointer;" id="eye-icon">👁</span>
            </div>
            <div class="forgot">
                <a href="{% url 'password_reset' %}">¿Olvidaste tu contraseña?</a>
            </div>

            <button type="submit" class="btn-login">
                INICIAR SESIÓN →
            </button>
        </form>

        <div class="divider">¿No tienes una cuenta?</div>
        <div class="register-link">
            <a href="{% url 'usuarios:registro' %}">Crear Cuenta</a>
        </div>
    </div>
    <div class="footer">
        © 2026 Mimada. Artesanía Colombiana.<br>
        📱 Contacto: 323 888 3587<br>
        📷 Instagram: @mimada.detalles
    </div>
</div>
<script>
    function togglePassword() {
        const input = document.getElementById('password');
        const icon = document.getElementById('eye-icon');
        if (input.type === 'password') {
            input.type = 'text';
            icon.textContent = '🙈';
        } else {
            input.type = 'password';
            icon.textContent = '👁';
        }
    }
</script>
</body>
</html>
