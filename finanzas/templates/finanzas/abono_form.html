<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Abono</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif; background: #fdf0f5; min-height: 100vh;
            display: flex; align-items: center; justify-content: center; padding: 1rem;
        }
        .card { background: white; border-radius: 16px; border: 1px solid #f0c0d4; padding: 2rem; width: 100%; max-width: 400px; }
        h2 { color: #c2185b; margin-bottom: 1.5rem; font-size: 20px; }
        .field-label { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; margin-bottom: 6px; display: block; }
        .field-wrap { margin-bottom: 1rem; }
        .form-input { width: 100%; border: 1px solid #f0c0d4; border-radius: 8px; padding: 10px 12px; font-size: 14px; background: #fff9fb; outline: none; }
        .btn-primary { width: 100%; background: #c2185b; color: white; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
        .btn-primary:hover { background: #880e4f; }
        .back-link { text-align: center; margin-top: 1.2rem; font-size: 13px; }
        .back-link a { color: #e91e8c; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Registrar Abono</h2>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
            <div class="field-wrap">
                <label class="field-label">{{ field.label }}</label>
                {{ field }}
                {{ field.errors }}
            </div>
            {% endfor %}
            <button type="submit" class="btn-primary">Guardar Abono</button>
        </form>
        <div class="back-link"><a href="{% url 'finanzas:dashboard' %}">← Volver a Finanzas</a></div>
    </div>
</body>
</html>
